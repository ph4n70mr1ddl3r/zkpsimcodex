[package]
name = "zkpsimcodex"
version = "0.1.0"
edition = "2021"
description = "A Zero-Knowledge Proof simulator demonstrating ring signatures and Merkle tree membership proofs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/zkpsimcodex"
readme = "README.md"
keywords = ["zero-knowledge", "cryptography", "ring-signature", "merkle-tree", "zkp"]
categories = ["cryptography"]

[dependencies]
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
k256 = { version = "0.13", features = ["arithmetic", "sha256"] }
tiny-keccak = { version = "2", features = ["keccak"] }
thiserror = "1.0"

[dev-dependencies]
hex-literal = "0.4"
